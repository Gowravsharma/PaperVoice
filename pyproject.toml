[project]
name = "papervoice"
version = "1.0.0"
description = "Listen to research papers, maths included: PDF to natural speech on a CPU, with the words highlighted as they are read"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "src/pdf_reader/vendor/tableformer/LICENSE"]
requires-python = ">=3.14"
# Every model runs on ONNX Runtime; PyTorch is not needed (see docs/JOURNEY.md, "No PyTorch").
# docling-slim is pinned exactly: onnx_layout.py / onnx_tableformer.py replace parts of its internals.
dependencies = [
    "docling-slim[format-pdf,convert-core,feat-ocr-rapidocr]==2.141.0",
    "onnxruntime>=1.31.0",
    "huggingface-hub>=0.23",
    "tokenizers>=0.20",
    "opencv-python-headless>=4.10",
    "ftfy>=6.3.1",
    "piper-tts[alignment]>=1.8.0",
    "wetext>=0.1.8",
    "psutil>=5.9",
]

[project.scripts]
papervoice-convert = "pdf_reader:main"
papervoice-script = "pdf_reader.script:main"
papervoice-stream = "pdf_reader.stream:main"
papervoice-read = "pdf_reader.read_aloud:main"
papervoice-server = "pdf_reader.server:main"
papervoice-models = "pdf_reader.models:main"
papervoice-setup = "pdf_reader.native_host:setup"
papervoice-doctor = "pdf_reader.doctor:main"

[dependency-groups]
# only for re-exporting the table model to ONNX (bench/export_tableformer.py, bench/vendor_tableformer.py)
# and comparing against the PyTorch originals (bench/check_onnx_layout.py): uv sync --group export
export = [
    "docling-slim[models-local]==2.141.0",
    "transformers",
    "onnx",
    "onnxscript",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pdf_reader"  # the package keeps its name; the project and its commands are PaperVoice
